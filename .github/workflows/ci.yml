name: POS checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: upul_pos
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d upul_pos"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/upul_pos?schema=public
      AUTH_SECRET: ci-only-secret-for-disposable-test-environment
      AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm test
      - run: node --test --test-concurrency=1 tests/*.integration.mjs
      - run: npm run lint
      - run: npm run build
